name: Python Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
# Run this workflow whenever a PR targets main and the branch has new commits.

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov coverage

      - name: Run unit tests with coverage and verbose output
        env:
          PYTHONPATH: .
        run: |
          # Run the project test suite and produce detailed coverage output.
          pytest --cov=src --cov-report=term-missing -vv
